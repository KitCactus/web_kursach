<div class="login-container">
  <div class="login-card">
    <div class="login-header">
      <div class="login-logo">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
          <path d="M18 8h1a4 4 0 0 1 0 8h-1" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          <path d="M2 8h16v9a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4V8z" stroke="currentColor" stroke-width="2"/>
          <line x1="6" y1="1" x2="6" y2="4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          <line x1="10" y1="1" x2="10" y2="4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          <line x1="14" y1="1" x2="14" y2="4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </div>
      <h1>Coffee&amp;Go</h1>
      <p>Панель управления</p>
    </div>

    <form (ngSubmit)="onSubmit()" class="login-form">
      @if (errorMessage) {
        <div class="error-message">
          {{ errorMessage }}
        </div>
      }

      <div class="form-group">
        <label for="username">Логин <span class="required">*</span></label>
        <input
          type="text"
          id="username"
          name="username"
          [(ngModel)]="credentials.username"
          placeholder="Введите логин"
          class="form-input"
          [class.input-error]="fieldErrors.username"
        />
        @if (fieldErrors.username) {
          <span class="field-error">{{ fieldErrors.username }}</span>
        }
      </div>

      <div class="form-group">
        <label for="password">Пароль <span class="required">*</span></label>
        <input
          type="password"
          id="password"
          name="password"
          [(ngModel)]="credentials.password"
          placeholder="Введите пароль"
          class="form-input"
          [class.input-error]="fieldErrors.password"
        />
        @if (fieldErrors.password) {
          <span class="field-error">{{ fieldErrors.password }}</span>
        }
      </div>

      <button
        type="submit"
        class="login-button"
        [disabled]="isLoading"
      >
        @if (isLoading) {
          <span class="loading-spinner"></span>
          Вход...
        } @else {
          Войти
        }
      </button>
    </form>
  </div>
</div>
